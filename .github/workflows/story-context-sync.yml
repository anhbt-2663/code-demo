name: Story context sync

# PR merged ⇒ ghi Spec / Design / API docs vào `References & Dependencies` của story cha.
#
# VÌ SAO CÓ WORKFLOW NÀY — ca thật:
#   Template story có sẵn ba ô `- Design: [Link Figma]` / `[Link]` / `[Link]`.
#   Cả ba thường vẫn là placeholder dù mọi ticket con đã đóng. Template thiết kế đúng,
#   thói quen điền tay thì không tồn tại. Đây là loại việc máy nên làm.
#
# PR MERGED LÀ SỰ KIỆN DUY NHẤT — không xét trạng thái issue:
#   File đã vào nhánh chính thì link tới nó là đúng, ticket còn mở hay đã đóng
#   không đổi điều đó. Chờ issue đóng mới ghi thì gặp bẫy thứ tự: PR merge trước,
#   lúc đó issue còn mở nên bot bỏ qua; rồi `issues: closed` lại bắn ở repo QUẢN LÝ
#   nên repo này không nghe được ⇒ story trống vĩnh viễn.
#
# PR merged là TÍN HIỆU, còn DỮ LIỆU lấy từ TOÀN BỘ PR merged của issue:
#   Một issue thường có nhiều PR. Nếu mỗi PR chỉ ghi phần file của riêng nó thì
#   lần ghi sau xoá mất kết quả lần trước. Gom lại từ đầu mỗi lần thì luôn đúng,
#   và chạy lại bao nhiêu lần cũng cho cùng một kết quả.
#
# KHÔNG CÓ CRON — có chủ ý:
#   Từng có một workflow quét định kỳ để lật nhãn "tạm → đã chốt" khi issue đóng.
#   Đã bỏ cả nhãn lẫn cron: nhãn chép lại thứ nhìn thẳng vào ticket là biết, còn
#   cron sau đó chỉ còn tác dụng chạy lại khi lượt sync hỏng — việc chưa xảy ra
#   lần nào, và `workflow_dispatch` bên dưới xử lý được trong 10 giây.
#
# KHÔNG CÓ `paths:` — CÓ CHỦ Ý:
#   Script tự lọc theo file PR đụng và theo screen_id. Thêm bộ lọc ở đây là đúc ra
#   một danh sách thứ hai phải giữ đồng bộ, và đã có tiền lệ hỏng vì quên thêm một dòng vào `paths:` . Job rẻ — cứ chạy rồi thoát sớm.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_ref:
        description: 'Issue cần đồng bộ, dạng owner/repo#N (vd anhbt-2663/pm-demo#123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Nối đuôi theo story chứ không huỷ: hai PR cùng story merge sát nhau đều phải
  # được ghi. `cancel-in-progress` ở đây sẽ làm mất một lần cập nhật.
  group: story-context-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/story-context

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ghi context vào story cha
        env:
          # Cần `Issues: write` trên anhbt-2663/pm-demo.
          # GITHUB_TOKEN mặc định KHÔNG ghi được sang repo khác.
          GH_TOKEN: ${{ secrets.PM_REPO_TOKEN }}
          # Repo chứa issue. Đặt biến repo PM_REPO khi chạy trên cặp repo khác (bản thử nghiệm).
          PM_REPO: ${{ vars.PM_REPO || 'anhbt-2663/pm-demo' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Chỉ có khi chạy tay — dùng cho issue đóng bằng tay, không qua PR nào.
          ISSUE_REF: ${{ inputs.issue_ref }}
          # Đặt DRY_RUN=1 ở lần chạy thật đầu tiên: in ra body sẽ ghi, không ghi thật.
          DRY_RUN: ${{ vars.STORY_CONTEXT_DRY_RUN || '0' }}
        run: node .github/scripts/story-context/sync-story-context.mjs
